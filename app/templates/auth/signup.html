{% extends "base.html" %}

{% block title %}Sign Up - PetroChem Match{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-3xl font-bold mb-6 text-center">Create Account</h1>
    
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-2">Full Name</label>
            <input type="text" name="full_name" required class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600">
        </div>
        
        <div>
            <label class="block text-sm font-medium mb-2">Email</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600">
        </div>
        
        <div>
            <label class="block text-sm font-medium mb-2">Role</label>
            <select name="role" required class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600">
                <option value="">Select a role</option>
                {% for r in roles %}
                    <option value="{{ r }}">{{ r.title() }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block text-sm font-medium mb-2">Company (Optional)</label>
            <input type="text" name="company" class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600">
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-bold">
            Sign Up
        </button>
    </form>
    
    <p class="text-center text-slate-600 dark:text-slate-400 mt-4">
        Already have an account? <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:underline">Login</a>
    </p>
</div>
{% endblock %}
