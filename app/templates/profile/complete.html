{% extends "base.html" %}

{% block title %}Complete Profile - PetroChem Match{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-lg shadow-lg">
    <h1 class="text-3xl font-bold mb-6">Complete Your Profile</h1>
    
    <form method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium mb-2">Bio</label>
            <textarea name="bio" rows="4" class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600"></textarea>
        </div>
        
        <div>
            <label class="block text-sm font-medium mb-2">Location</label>
            <input type="text" name="location" placeholder="e.g., Houston, TX" class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600">
        </div>
        
        <div>
            <label class="block text-sm font-medium mb-2">Years of Experience</label>
            <input type="number" name="years_experience" min="0" max="60" class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600">
        </div>
        
        <div>
            <label class="block text-sm font-medium mb-2">Expertise Tags (comma-separated)</label>
            <input type="text" name="expertise_tags" placeholder="e.g., catalysts, corrosion-inhibitors, CO2-capture" class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600">
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-bold">
            Save Profile
        </button>
    </form>
</div>
{% endblock %}
